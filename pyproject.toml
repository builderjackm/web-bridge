[project]
name = "webbridge"
version = "0.1.0"
description = "Local Chrome extension to CDP bridge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.9,<4"]

[project.scripts]
webbridge = "web_bridge.cli:main"
webbridge-daemon = "web_bridge.daemon:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "web_bridge"
